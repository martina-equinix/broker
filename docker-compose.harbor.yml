# Snyk Broker Classic — LOCAL POC (Harbor + ArgoCD)
#
# ⚠️  THIS FILE IS FOR LOCAL DEVELOPMENT ONLY.
#     Production deployment uses Helm — see README.harbor.md § Production.
#
# Three containers, all on the same Docker network (simulates METAL + GEN
# on a single laptop):
#   broker-server        – shared server; Backstage points ALL plugins here
#   broker-harbor-client – one client process proxying to Harbor
#   broker-argocd-client – one client process proxying to ArgoCD
#
# Both clients use the same image (broker-client:latest); the backend is
# selected at runtime via BACKEND_URL, BROKER_TOKEN, and ACCEPT.
#
# Usage:
#   cp .env.harbor.example .env.harbor   # fill in credentials & tokens
#   docker compose -f docker-compose.harbor.yml --env-file .env.harbor up --build -d
#
# Backstage app-config.local.yaml:
#   harbor.baseUrl:  http://localhost:7341/broker/<HARBOR_BROKER_TOKEN>/
#   argocd.url:      http://localhost:7341/broker/<ARGOCD_BROKER_TOKEN>
#
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Broker SERVER (shared) ───────────────────────────────────────────────────
  broker-server:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.server
    image: broker-server:latest
    container_name: broker-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-7341}:${SERVER_PORT:-7341}"
    environment:
      PORT: ${SERVER_PORT:-7341}
      ACCEPT: /home/node/accept.server.json
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${SERVER_PORT:-7341}/healthcheck', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Broker CLIENT — Harbor ────────────────────────────────────────────────────
  broker-harbor-client:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.client
    image: broker-client:latest
    container_name: broker-harbor-client
    restart: unless-stopped
    depends_on:
      broker-server:
        condition: service_healthy
    ports:
      - "${HARBOR_PORT:-8001}:${HARBOR_PORT:-8001}"
    environment:
      BROKER_SERVER_URL: http://broker-server:${SERVER_PORT:-7341}
      BROKER_TOKEN: ${HARBOR_BROKER_TOKEN:?HARBOR_BROKER_TOKEN is required (UUIDv4)}
      BACKEND_URL: ${HARBOR_URL:-https://harbor.delivery.metalkube.net}
      BROKER_CLIENT_URL: http://broker-harbor-client:${HARBOR_PORT:-8001}
      PORT: ${HARBOR_PORT:-8001}
      ACCEPT: /home/node/accept.harbor-client.json
      HARBOR_USERNAME: ${HARBOR_USERNAME}
      HARBOR_PASSWORD: ${HARBOR_PASSWORD}

  # ── Broker CLIENT — ArgoCD ───────────────────────────────────────────────────
  broker-argocd-client:
    image: broker-client:latest   # reuses same image, no build needed
    container_name: broker-argocd-client
    restart: unless-stopped
    depends_on:
      broker-server:
        condition: service_healthy
    ports:
      - "${ARGOCD_PORT:-8002}:${ARGOCD_PORT:-8002}"
    environment:
      BROKER_SERVER_URL: http://broker-server:${SERVER_PORT:-7341}
      BROKER_TOKEN: ${ARGOCD_BROKER_TOKEN:?ARGOCD_BROKER_TOKEN is required (UUIDv4)}
      BACKEND_URL: ${ARGOCD_URL:-https://argo.delivery.metalkube.net}
      BROKER_CLIENT_URL: http://broker-argocd-client:${ARGOCD_PORT:-8002}
      PORT: ${ARGOCD_PORT:-8002}
      ACCEPT: /home/node/accept.argocd-client.json
      ARGOCD_TOKEN: ${ARGOCD_TOKEN:?ARGOCD_TOKEN is required}
